---
- name: Setup Vim with Plugins for a specific user (Linux only)
  hosts: localhost
  connection: local
  become: yes

  vars:
    # User variable - can be overridden via command line with -e "user=username"
    user: "{{ ansible_user_id | default(lookup('env', 'USER')) | default(ansible_user) }}"
    # Define base paths
    is_root_user: "{{ user == 'root' }}"
    base_path: "{{ is_root_user | ternary('/root', '/home/' + user) }}"
    vim_autoload_path: "{{ base_path }}/.vim/autoload"
    vim_plugged_path: "{{ base_path }}/.vim/plugged"
    vimrc_path: "{{ base_path }}/.vimrc"

  pre_tasks:
    - name: Debug - Show configuration
      debug:
        msg:
          - "Setting up Vim for user: {{ user }}"
          - "Base path: {{ base_path }}"
          - "Vim paths:"
          - "  - autoload: {{ vim_autoload_path }}"
          - "  - plugged: {{ vim_plugged_path }}"
          - "  - vimrc: {{ vimrc_path }}"

  tasks:
    # Install dependencies across distros
    - name: Install Vim, curl, and bash
      package:
        name:
          - vim
          - curl
          - bash
        state: present
#      update_cache: yes

    # Create Vim directories
    - name: Create Vim directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: "{{ user }}"
        group: "{{ user }}"
      loop:
        - "{{ vim_autoload_path }}"
        - "{{ vim_plugged_path }}"

    # Copy .vimrc
    - name: Copy .vimrc
      copy:
        dest: "{{ vimrc_path }}"
        content: |
          " Disable compatibility with vi which can cause unexpected issues.
          set nocompatible

          " Enable filetype detection, plugins, and indentation
          filetype on
          filetype plugin on
          filetype indent on

          set number
          set cursorline
          set cursorcolumn
          set shiftwidth=4
          set tabstop=4
          set expandtab
          set nobackup
          set scrolloff=10
          set nowrap
          set incsearch
          set ignorecase
          set smartcase
          set showcmd
          set showmode
          set showmatch
          set hlsearch
          set history=1000
          set wildmenu
          set wildmode=list:longest
          set wildignore=*.docx,*.jpg,*.png,*.gif,*.pdf,*.pyc,*.exe,*.flv,*.img,*.xlsx

          " PLUGINS --------------------------------------------------------------
          call plug#begin('{{ vim_plugged_path }}')
            Plug 'dense-analysis/ale'
            Plug 'preservim/nerdtree'
            Plug 'tpope/vim-fugitive'
            Plug 'vim-airline/vim-airline'
            Plug 'vim-airline/vim-airline-themes'
          call plug#end()

          " MAPPINGS -------------------------------------------------------------
          nnoremap <C-n> :NERDTreeToggle<CR>
          nnoremap <leader>d :ALEDetail<CR>
          nnoremap <leader>f :ALEFix<CR>

          " VIMSCRIPT ------------------------------------------------------------
          augroup filetype_vim
              autocmd!
              autocmd FileType vim setlocal foldmethod=marker
          augroup END

          " STATUS LINE ----------------------------------------------------------
          set statusline=
          set statusline+=\ %F\ %M\ %Y\ %R
          set statusline+=%=
          set statusline+=\ ascii:\ %b\ hex:\ 0x%B\ row:\ %l\ col:\ %c\ percent:\ %p%%
          set laststatus=2
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: '0644'

    # Download vim-plug
    - name: Download vim-plug
      get_url:
        url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
        dest: "{{ vim_autoload_path }}/plug.vim"
        mode: '0644'
        owner: "{{ user }}"
        group: "{{ user }}"
        validate_certs: true
        timeout: 30
        force: true

    # Install plugins
    - name: Install Vim plugins
      become: yes
      become_user: "{{ user }}"
      shell: "bash -lc 'vim -c \"PlugInstall --sync\" -c \"qa!\"'"
      args:
        executable: /bin/bash
      register: plugin_install
      changed_when: "'Already up to date' not in plugin_install.stdout"
      failed_when: false

    # Verify installation
    - name: List installed plugins
      command: ls -la "{{ vim_plugged_path }}"
      register: plugin_list
      changed_when: false

    - name: Debug - Show installed plugins
      debug:
        msg: "{{ plugin_list.stdout_lines }}"

