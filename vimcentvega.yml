---
- name: Setup Vim with Plugins for a specific user (Unix/Linux only)
  hosts: localhost
  connection: local
  become: yes
  vars:
    # User variable - can be overridden via command line with -e "user=username"
    user: "{{ ansible_user_id | default(lookup('env', 'USER')) | default(ansible_user) }}"
    # Define base paths
    is_root_user: "{{ user == 'root' }}"
    base_path: "{{ is_root_user | ternary('/root', '/home/' + user) }}"
    vim_autoload_path: "{{ base_path }}/.vim/autoload"
    vim_plugged_path: "{{ base_path }}/.vim/plugged"
    vimrc_path: "{{ base_path }}/.vimrc"

  pre_tasks:
    - name: Debug - Show configuration
      debug:
        msg:
          - "Setting up Vim for user: {{ user }}"
          - "Base path: {{ base_path }}"
          - "Vim paths:"
          - "  - autoload: {{ vim_autoload_path }}"
          - "  - plugged: {{ vim_plugged_path }}"
          - "  - vimrc: {{ vimrc_path }}"

  tasks:
    # Debian/Ubuntu tasks
    - name: Install Vim, curl, and bash on Debian/Ubuntu
      when: ansible_os_family == "Debian"
      apt:
        name:
          - vim
          - curl
          - bash
        state: present
        update_cache: yes

    # RHEL/CentOS tasks
    - name: Install Vim, curl, and bash on RHEL/CentOS
      when: ansible_os_family == "RedHat"
      yum:
        name:
          - vim-enhanced
          - curl
          - bash
        state: present

    # Alpine Linux tasks
    - name: Install Vim, curl, and bash on Alpine Linux
      when: ansible_os_family == "Alpine"
      apk:
        name:
          - vim
          - curl
          - bash
        state: present

    # Create Vim directories with proper permissions
    - name: Create Vim directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: "{{ user }}"
        group: "{{ user }}"
      with_items:
        - "{{ vim_autoload_path }}"
        - "{{ vim_plugged_path }}"

    # Copy .vimrc
    - name: Copy .vimrc
      copy:
        dest: "{{ vimrc_path }}"
        content: "\" Disable compatibility with vi which can cause unexpected issues.\nset nocompatible\n\n\" Enable type file detection. Vim will be able to try to detect the type of file in use.\nfiletype on\n\n\" Enable plugins and load plugin for the detected file type.\nfiletype plugin on\n\n\" Load an indent file for the detected file type.\nfiletype indent on\n\nset number\n\n\" Highlight cursor line underneath the cursor horizontally.\nset cursorline\n\n\" Highlight cursor line underneath the cursor vertically.\nset cursorcolumn\n\n\" Set shift width to 4 spaces.\nset shiftwidth=4\n\n\" Set tab width to 4 columns.\nset tabstop=4\n\n\" Use space characters instead of tabs.\nset expandtab\n\n\" Do not save backup files.\nset nobackup\n\n\" Do not let cursor scroll below or above N number of lines when scrolling.\nset scrolloff=10\n\n\" Do not wrap lines. Allow long lines to extend as far as the line goes.\nset nowrap\n\n\" While searching though a file incrementally highlight matching characters as you type.\nset incsearch\n\n\" Ignore capital letters during search.\nset ignorecase\n\n\" Override the ignorecase option if searching for capital letters.\n\" This will allow you to search specifically for capital letters.\nset smartcase\n\n\" Show partial command you type in the last line of the screen.\nset showcmd\n\n\" Show the mode you are on the last line.\nset showmode\n\n\" Show matching words during a search.\nset showmatch\n\n\" Use highlighting when doing a search.\nset hlsearch\n\n\" Set the commands to save in history default number is 20.\nset history=1000\n\n\" Enable auto completion menu after pressing TAB.\nset wildmenu\n\n\" Make wildmenu behave like similar to Bash completion.\nset wildmode=list:longest\n\n\" There are certain files that we would never want to edit with Vim.\n\" Wildmenu will ignore files with these extensions.\nset wildignore=*.docx,*.jpg,*.png,*.gif,*.pdf,*.pyc,*.exe,*.flv,*.img,*.xlsx\n\n\" PLUGINS ----------------------------------------------------------------\n\ncall plug#begin('{{ vim_plugged_path }}')\n\n  \" Linting and syntax checking\n  Plug 'dense-analysis/ale'\n  \n  \" File tree explorer\n  Plug 'preservim/nerdtree'\n  \n  \" Git integration\n  Plug 'tpope/vim-fugitive'\n  \n  \" Status line enhancement\n  Plug 'vim-airline/vim-airline'\n  Plug 'vim-airline/vim-airline-themes'\n\ncall plug#end()\n\n\" MAPPINGS ---------------------------------------------------------------\n\n\" Map NERDTree toggle to Ctrl+n\nnnoremap <C-n> :NERDTreeToggle<CR>\n\n\" Map ALE commands\nnnoremap <leader>d :ALEDetail<CR>\nnnoremap <leader>f :ALEFix<CR>\n\n\" VIMSCRIPT --------------------------------------------------------------\n\n\" This will enable code folding.\n\" Use the marker method of folding.\naugroup filetype_vim\n    autocmd!\n    autocmd FileType vim setlocal foldmethod=marker\naugroup END\n\n\" STATUS LINE ----------------------------------------------------------\n\n\" Clear status line when vimrc is reloaded.\nset statusline=\n\n\" Status line left side.\nset statusline+=\\ %F\\ %M\\ %Y\\ %R\n\n\" Use a divider to separate the left side from the right side.\nset statusline+=%=\n\n\" Status line right side.\nset statusline+=\\ ascii:\\ %b\\ hex:\\ 0x%B\\ row:\\ %l\\ col:\\ %c\\ percent:\\ %p%%\n\n\" Show the status on the second to last line.\nset laststatus=2\n"
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: '0644'

    # Install vim-plug first
    - name: Ensure .vim/autoload directory exists
      file:
        path: "{{ vim_autoload_path }}"
        state: directory
        mode: '0755'
        owner: "{{ user }}"
        group: "{{ user }}"

    - name: Download vim-plug
      get_url:
        url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
        dest: "{{ vim_autoload_path }}/plug.vim"
        mode: '0644'
        owner: "{{ user }}"
        group: "{{ user }}"
        validate_certs: true
        timeout: 30
        force: true

    # Install plugins
    - name: Install Vim plugins
      become: yes
      become_user: "{{ user }}"
      shell: "bash -lc 'vim -c \"PlugInstall\" -c \"qa!\"'"
      args:
        executable: /bin/bash
      register: plugin_install
      changed_when: "'Already up to date' not in plugin_install.stdout"
      failed_when: false

    # Verify installation
    - name: List installed plugins
      command: ls -la "{{ vim_plugged_path }}"
      register: plugin_list
      changed_when: false

    - name: Debug - Show installed plugins
      debug:
        msg: "{{ plugin_list.stdout_lines }}"
